version: "3.9"

# Dev overrides — lighter resource limits, extra debugging
services:
  postgres:
    environment:
      POSTGRES_MULTIPLE_DATABASES: "openfoundry_auth,openfoundry_connector,openfoundry_dataset,openfoundry_streaming,openfoundry_query,openfoundry_pipeline,openfoundry_ontology,openfoundry_fusion,openfoundry_ml,openfoundry_ai,openfoundry_workflow,openfoundry_notebook,openfoundry_apps,openfoundry_report,openfoundry_code,openfoundry_market,openfoundry_nexus,openfoundry_geo,openfoundry_notify,openfoundry_audit"
    ports:
      - "5432:5432"

  redis:
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel verbose

  nats:
    command: --jetstream --store_dir /data --http_port 8222 -DV

  minio:
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin