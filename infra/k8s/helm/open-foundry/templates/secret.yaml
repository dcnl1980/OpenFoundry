{{- if not .Values.global.jwt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-foundry.jwtSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openfoundry
type: Opaque
stringData:
  {{ .Values.global.jwt.secretKey }}: {{ required "global.jwt.value is required when global.jwt.existingSecret is empty" .Values.global.jwt.value | quote }}
---
{{- end }}
{{- if not .Values.global.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-foundry.dbSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openfoundry
type: Opaque
stringData:
{{- range $serviceName, $service := .Values.services }}
{{- $merged := mergeOverwrite (deepCopy $.Values.serviceDefaults) $service }}
{{- if and $merged.enabled $merged.database }}
  {{ include "open-foundry.databaseUrlKey" $serviceName }}: {{ include "open-foundry.runtimeDatabaseUrl" (dict "root" $ "database" $merged.database) | quote }}
  {{ include "open-foundry.migrationUrlKey" $serviceName }}: {{ include "open-foundry.migrationDatabaseUrl" (dict "root" $ "database" $merged.database) | quote }}
{{- end }}
{{- end }}
{{- end }}
